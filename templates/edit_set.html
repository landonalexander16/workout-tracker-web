{% extends "base.html" %}

{% block title %}Edit Set{% endblock %}

{% block content %}
{% if error %}<p style="color: red">{{ error }}</p>{% endif %}
<form method="post">
    <label>Weight <input type="number" name="weight" step="any" min="0" value="{{ s.weight }}" required></label>
    <label>Reps <input type="number" name="reps" min="1" value="{{s.reps}}" required> </label>
    <button type="submit">Save</button>
    <a href="{{ url_for('show_workout') }}">Cancel</a>
</form>
{% endblock %}
