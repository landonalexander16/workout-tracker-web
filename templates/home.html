{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
  <h1>Workout Tracker</h1>
  <p>Track the workouts you've done.</p>

  <a href="{{ url_for('add') }}">Add a session</a>
  <a href="{{ url_for('show_workout') }}">View past sessions</a>

  {# "sessions" is the count passed in by the home() route in app.py #}
  <p>{{ sessions }} session(s) logged so far.</p>
{% endblock %}
