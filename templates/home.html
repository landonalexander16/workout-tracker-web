{% extends "base.html" %}

{% block content %}
  <h1>Workout Tracker</h1>
  {% if current_user.is_authenticated %}
    <p>{{ sessions }} workout(s) logged so far.</p>
    <a href="{{ url_for('add') }}">Add a workout</a>
{% else %}
    <p>Track the workouts you've done and their details.</p>
    <a href="{{ url_for('register') }}">Create an account</a>
    <a href="{{ url_for('login') }}">Log in</a>
{% endif %}
{% endblock %}
